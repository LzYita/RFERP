name: CodeQL (Go)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '17 5 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL / Go
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10' # keep in sync with PR checks
          cache: true

      # Fail on missing CGO dependencies instead of accepting partial extraction.
      - name: Verify Linux package build
        env:
          CGO_ENABLED: '1'
        run: |
          go build ./...

      - name: Initialize CodeQL
        id: codeql
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: go
          build-mode: autobuild

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          # Keep raw results available for alert-path and failed-run triage.
          output: codeql-results.sarif

      - name: Verify path model sentinels
        env:
          CODEQL_BIN: ${{ steps.codeql.outputs.codeql-path }}
        run: bash .github/codeql/verify-path-models.sh

      - name: Upload SARIF for triage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif
          path: codeql-results.sarif
          if-no-files-found: warn
