# DataDir is the root selected by the local operator, including authenticated
# host-only POST /api/datadir, startup-token-protected setup, config and environment.
# This trusts the root, not a request-supplied child name. The scanner sentinels
# require raw paths and raw child names under DataDir to remain reportable.
# Revisit if a remote deployment enables host operations, permissions/gateway are
# removed, or root selection becomes available to an untrusted operator.
#
# ResolveExistingUnder returns the canonical existing target only after physical
# containment under its root. Current callers supply trusted BackupDir/ExportDir.
# Revisit its model if a caller supplies an untrusted root, containment changes,
# or modifies the checked path. This snapshot check does not prevent filesystem
# replacement races; hostile local filesystems require rooted handles.
extensions:
  - addsTo:
      pack: codeql/go-all
      extensible: barrierModel
    data:
      - ["app/internal/paths", "", False, "DataDir", "", "", "ReturnValue", "path-injection", "manual"]
      - ["app/internal/paths", "", False, "ResolveExistingUnder", "", "", "ReturnValue[0]", "path-injection", "manual"]
